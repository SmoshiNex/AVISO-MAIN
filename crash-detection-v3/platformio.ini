; ============================================================
; AVISO crash detection — PlatformIO project
; ------------------------------------------------------------
; One environment per sketch. Each builds only its own folder
; under src/ (build_src_filter), so the sketches never collide.
;
;   pio run -e aviso-iot -t upload            field firmware
;   pio run -e threshold-gathering -t upload  data gathering
;   pio device monitor                        Serial Monitor (115200)
;
; In VS Code: pick the environment in the bottom status bar,
; then Upload (→) and Monitor (plug icon).
;
; ALL environments share partitions.csv on purpose: the LittleFS
; storage stays at the same place, so flashing another sketch
; (e.g. retrieval) never wipes threshold data or the black box.
; Calibration (EEPROM) and saved hotspots (Preferences) live in
; the NVS partition, which is also shared.
; ============================================================

[platformio]
default_envs = aviso-iot
src_dir = src

[env]
; pioarduino = Arduino-ESP32 core 3.x (the official espressif32
; platform is still on core 2.x; the sketches use the 3.x watchdog API)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

; ---------------------------------------------------------------- field firmware
[env:aviso-iot]
build_src_filter = +<aviso-iot/>
lib_deps =
    ${env.lib_deps}
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------- data gathering
[env:threshold-gathering]
build_src_filter = +<threshold-gathering/>

[env:calibration]
build_src_filter = +<calibration/>

[env:retrieval-littlefs]
build_src_filter = +<retrieval-littlefs/>

[env:storage-cleanup]
build_src_filter = +<storage-cleanup/>

; ---------------------------------------------------------------- utilities / reference
[env:testing-buzzer]
build_src_filter = +<testing-buzzer/>

; Earlier field logger, kept for reference (superseded by aviso-iot)
[env:crash-detection]
build_src_filter = +<crash-detection/>
